# Cloudflare Worker settings. Cloudflare reads this file on every deploy.
# "name" must match the Worker's name in the Cloudflare dashboard.
name = "chunk-planner"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# The built app (npm run build). /api/* always goes to the Worker; any other unknown path gets the app.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "chunk-planner"
# The chunk-planner D1 database in your Cloudflare account.
database_id = "af7c79d9-bb64-462f-91be-84ce6c0ecd2e"

[vars]
# Filled in after Cloudflare Access is set up (README, step 4). Until both are set, the planner stays locked.
ACCESS_TEAM_DOMAIN = ""   # e.g. "chunkhistory.cloudflareaccess.com"
ACCESS_AUD = ""           # the Application Audience (AUD) tag
