# Cloudflare Worker settings. Cloudflare reads this file on every deploy.
# "name" must match the Worker's name in the Cloudflare dashboard.
name = "chunk-planner"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# The built app (npm run build). /api/* always goes to the Worker; any other unknown path gets the app.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "chunk-planner"
# The chunk-planner D1 database in your Cloudflare account.
database_id = "af7c79d9-bb64-462f-91be-84ce6c0ecd2e"

[vars]
# Cloudflare Access (Zero Trust) for this Worker. Every /api request must carry a token signed for this app.
ACCESS_TEAM_DOMAIN = "soft-recipe-34d1.cloudflareaccess.com"
ACCESS_AUD = "fd10328ecb12adce8137a2a97758edcc97c0afd4eadfbe71ba301416902e40ba"
